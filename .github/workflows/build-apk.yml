name: Build Android APK

# Builds the FamilyTrack child app into a debug APK.
# Runs on every push to this branch and can be triggered manually.
# Download the APK from the run's "Artifacts" section when it finishes.

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the obsolete 'tools' package (removed by Google); install what the build needs.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk familytrack.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: familytrack-debug-apk
          path: familytrack.apk
          if-no-files-found: error

      # Publish the APK as a release asset so it has a direct, one-click
      # download link (no zip, easy on a phone).
      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FamilyTrack APK (latest build)
          body: |
            Latest debug APK built from the `${{ github.ref_name }}` branch.
            Tap **familytrack.apk** below to download and install on the device.
          files: familytrack.apk
          target_commitish: ${{ github.sha }}
